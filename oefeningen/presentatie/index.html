# Onderwerp

Ik heb gekozen voor vrouwelijke popartiesten, omdat ik zelf veel naar hun muziek luister. Mijn favoriete artiesten zijn Ariana Grande, Sabrina Carpenter, Olivia Rodrigo, Roxy Dekker en Tate McRae.
Ik vind het interessant om te onderzoeken wat deze artiesten zo populair maakt en wat ze met elkaar gemeen hebben. Ze maken allemaal popmuziek, maar hebben ook allemaal hun eigen stijl, uiterlijk, muziek en manier van optreden.
Tijdens mijn onderzoek wil ik kijken naar hun muziek, concerten, kleding, social media, fans en hun ontwikkeling als artiest.
